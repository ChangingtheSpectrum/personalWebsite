name: CI/CD to Docker Hub

# Trigger the workflow on every push to the main branch
on:
  push:
    branches: [ "personal" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Check out the code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx (allows advanced build features)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log in to Docker Hub using saved secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Step 4: Build the Docker image and push it to the registry
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Tags the image as 'latest' and with the unique GitHub commit SHA
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/personal-website:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/personal-website:${{ github.sha }}

